name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 . --exclude=.venv,__pycache__ --count

    docker:
    name: docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t opstrack-api:ci .

      - name: Subir o container e testar o /status
        run: |
          docker run -d --name api -p 8000:8000 opstrack-api:ci
          sleep 5
          curl --fail http://localhost:8000/status